apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apex-banking-staging

resources:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging
  managed-by: kustomize

patches:
  - target:
      kind: Deployment
      name: apex-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"