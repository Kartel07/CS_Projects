apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apex-banking-prod

resources:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production
  managed-by: kustomize

patches:
  - target:
      kind: Deployment
      name: apex-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: apex-api

patchesStrategicMerge:
  - |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: apex-api
    spec:
      template:
        spec:
          containers:
            - name: api
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "500m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
              env:
                - name: NODE_ENV
                  value: "production"