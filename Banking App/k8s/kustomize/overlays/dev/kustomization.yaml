apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apex-banking-dev

resources:
  - ../../base

namePrefix: dev-

commonLabels:
  environment: dev
  managed-by: kustomize

patches:
  - target:
      kind: Deployment
      name: apex-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: dev-apex-api-config-dev
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"