# ============================================================
# APEX BANKING — Docker Compose (Production Stack)
# ============================================================
# Services: Node.js API, MySQL 8, Redis (optional caching)
# ============================================================

services:
  # ── Backend API ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./root/Backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: apex_user
      DB_PASSWORD: ${DB_PASSWORD:-ChangeMe!}
      DB_NAME: apex_banking
      REDIS_HOST: redis
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - apex-network

  # ── MySQL Database ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: apex-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass!}
      MYSQL_DATABASE: apex_banking
      MYSQL_USER: apex_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-ChangeMe!}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./root/Backend/setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - apex-network

  # ── Redis (Session Cache / Rate Limiter) ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: apex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apex-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  apex-network:
    driver: bridge